function remember(key, value) { try { sessionStorage.setItem(key, value) } catch { /* private browsing may disable storage */ } }
function forget(key) { try { sessionStorage.removeItem(key) } catch { /* ignored */ } }
function restoreArticleUI(gate, content) {
  const toc = document.querySelector('[data-dynamic-toc]')
  if (toc) {
    const heading = document.createElement('h2'); heading.textContent = '目录'; toc.replaceChildren(heading)
    const list = document.createElement('ol')
    for (const [i, item] of [...content.querySelectorAll('h2,h3,h4')].entries()) {
      if (!item.id) item.id = `unlocked-section-${i}`
      const row = document.createElement('li'), link = document.createElement('a')
      link.href = `#${encodeURIComponent(item.id)}`
      link.textContent = item.textContent.replace(/\s*#\s*$/, '')
      row.style.marginInlineStart = `${(Number(item.tagName[1]) - 2) * 12}px`
      row.append(link); list.append(row)
    }
    toc.append(list)
    const button = document.getElementById('sidebar-btn')
    if (button) { button.classList.remove('hidden'); button.style.removeProperty('display') }
  }
  document.querySelectorAll('[data-unlock-only]').forEach(el => { el.hidden = false })
  for (const link of content.querySelectorAll('a[href*="/diagrams/"]')) link.removeAttribute('target')
  document.dispatchEvent(new CustomEvent('protected-content:unlocked', { detail: { gate } }))
}
export function initializeProtectedContent() {
  for (const gate of document.querySelectorAll('[data-protected-post]')) {
    if (gate.dataset.initialized === 'true') continue
    gate.dataset.initialized = 'true'
    const panel=gate.querySelector('[data-lock-panel]'), form=gate.querySelector('[data-unlock-form]'), input=gate.querySelector('[data-password-input]')
    const toggle=gate.querySelector('[data-visibility-toggle]'), submit=gate.querySelector('[data-unlock-button]'), label=gate.querySelector('[data-button-label]'), status=gate.querySelector('[data-gate-status]'), content=gate.querySelector('[data-protected-content]')
    if (!panel || !form || !input || !submit || !label || !status || !content) continue
    let envelope
    try {
      envelope=JSON.parse(gate.dataset.envelope || '')
      if (envelope.version!==1 || !Number.isSafeInteger(envelope.iterations) || envelope.iterations<1 || envelope.iterations>2000000 || decode64(envelope.salt).length!==16 || decode64(envelope.iv).length!==12 || decode64(envelope.ciphertext).length<16) throw new Error()
    } catch { status.textContent='密文格式异常，请联系作者。'; submit.disabled=true; continue }
    const cacheKey=`protected-post:${gate.dataset.storageKey || location.pathname}:${envelope.salt}`
    const busy=value=>{input.disabled=value;submit.disabled=value;form.setAttribute('aria-busy',String(value));label.textContent=value?'正在解锁…':gate.dataset.kind==='diagram'?'解锁交互白板':'解锁正文'}
    const unlock=async(key,focus)=>{
      const plaintext=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode64(envelope.iv)},key,decode64(envelope.ciphertext))
      const html=decoder.decode(plaintext)
      if (gate.dataset.kind==='diagram') {
        const frame=document.createElement('iframe')
        frame.title='已解锁的交互白板'
        frame.setAttribute('sandbox','allow-scripts allow-downloads')
        frame.referrerPolicy='no-referrer'
        frame.style.cssText='width:100%;height:calc(100vh - 60px);border:0;display:block'
        frame.srcdoc=html
        content.replaceChildren(frame)
      } else content.innerHTML=html
      content.hidden=false;content.removeAttribute('aria-hidden');panel.hidden=true;gate.classList.add('is-unlocked');input.value=''
      remember(cacheKey,encode64(await crypto.subtle.exportKey('raw',key)))
      if(gate.dataset.kind!=='diagram')restoreArticleUI(gate,content)
      if(focus)content.focus({preventScroll:true})
    }
    toggle?.addEventListener('click',()=>{const show=input.type==='password';input.type=show?'text':'password';toggle.textContent=show?'隐藏':'显示';toggle.setAttribute('aria-pressed',String(show));input.focus()})
    form.addEventListener('submit',async event=>{
      event.preventDefault();if(!input.value.trim()){status.textContent='请输入访问口令。';input.focus();return}
      busy(true);status.textContent='正在校验口令…'
      try {
        const material=await crypto.subtle.importKey('raw',encoder.encode(input.value.normalize('NFC')),'PBKDF2',false,['deriveKey'])
        const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:decode64(envelope.salt),iterations:envelope.iterations},material,{name:'AES-GCM',length:256},true,['decrypt'])
        await unlock(key,true)
      }catch{status.textContent='口令不正确，请检查后重试。';input.select()}finally{busy(false)}
    })
    if(!globalThis.crypto?.subtle){status.textContent='浏览器需要 HTTPS 和 Web Crypto 才能本地解密。';submit.disabled=true;continue}
    const saved=stored(cacheKey)
    if(saved){busy(true);crypto.subtle.importKey('raw',decode64(saved),{name:'AES-GCM'},true,['decrypt']).then(key=>unlock(key,false)).catch(()=>{forget(cacheKey);input.focus()}).finally(()=>busy(false))}
  }
}
